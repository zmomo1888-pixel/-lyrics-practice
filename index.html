<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sing It · 歌词学习</title>
<style>
:root{--a:#9b8cf4;--bg:#fff9fc;--card:#fff;--ink:#2e2934;--muted:#8a818e;--line:#eee6ee;--soft:#faf5f8;--ok:#eaf8ee;--warn:#fff5dc;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Apple SD Gothic Neo","Hiragino Sans",sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0%,color-mix(in srgb,var(--a) 12%,white),transparent 25%),var(--bg);color:var(--ink);font-family:var(--font)}
main{max-width:900px;margin:auto;padding:14px 12px 90px}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;margin:5px 2px 12px}h1{font-size:24px;margin:0}.small{font-size:12px;color:var(--muted)}
.card{background:color-mix(in srgb,var(--card) 97%,var(--a));border:1px solid var(--line);border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 5px 22px #00000008}
.hero{padding:18px}.hero h2{margin:0 0 5px;font-size:21px}.muted{color:var(--muted);font-size:13px;line-height:1.55}
.row,.chips,.palette{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}.primary,.soft,.chip,.mode{border-radius:999px;padding:10px 13px;border:1px solid var(--line);background:#fff}.primary{background:var(--a);color:#fff;border:0;font-weight:750}.chip input{accent-color:var(--a)}
textarea{width:100%;min-height:145px;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--soft);outline:none;font-size:16px}
textarea:focus,input:focus{border-color:var(--a);background:#fff}.dot{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.dot[data-c="#9b8cf4"]{background:#9b8cf4}.dot[data-c="#ee91b4"]{background:#ee91b4}.dot[data-c="#74b9a7"]{background:#74b9a7}.dot[data-c="#79a9e8"]{background:#79a9e8}.dot[data-c="#e8aa68"]{background:#e8aa68}.dot[data-c="#303038"]{background:#303038}
.tabs{display:flex;gap:6px;overflow:auto;padding:4px 0 8px;position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px)}
.mode.active{background:var(--a);color:#fff;border-color:var(--a)}.mode:disabled{opacity:.45}
.songrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}.bar{height:100%;background:var(--a);border-radius:99px}
.lyricHead{display:flex;gap:8px;align-items:flex-start}.lyricBody{flex:1;min-width:0}.roman{color:var(--a);font-size:13px;margin-bottom:5px}.tokens{display:flex;gap:6px;flex-wrap:wrap}.word{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-size:17px;font-weight:650}.translation{margin-top:7px;font-size:14px;color:var(--muted)}
.actions{display:flex;gap:6px;align-items:center}.round{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:50%}.original{background:color-mix(in srgb,var(--a) 12%,white);color:var(--a)}
.answers{display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);margin-top:11px;padding-top:11px}.ans{width:90px;height:39px;border:1px solid var(--line);border-radius:10px;text-align:center;background:var(--soft);outline:none}.ans.ok{background:var(--ok)}
.state{display:flex;gap:7px;margin-top:10px}.state button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px}.state .learned{background:var(--ok)}.state .starred{background:var(--warn)}
.big{text-align:center;padding:34px 14px}.big .mainline{font-size:28px;font-weight:800;line-height:1.45;margin:18px 0}.big .romaji{color:var(--a);font-size:16px}.nextline{color:var(--muted);margin-top:25px}.empty{text-align:center;color:var(--muted);padding:30px}
.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0}.hide{display:none!important}
</style></head>
<body><main>
<header><div><h1>🎧 Sing It</h1><div class="small">不用先学会一门语言，也可以先唱会喜欢的歌。</div></div><button id="settings" class="soft">⚙︎</button></header>

<section id="home">
 <div class="card hero"><h2>今天想唱哪首歌？ ♡</h2><div class="muted">歌曲会保存在这个浏览器里。下次打开可以继续上次的进度。</div><div class="row"><button id="newSong" class="primary">＋ 添加歌曲</button></div></div>
 <div id="library"></div>
</section>

<section id="editor" class="hide">
 <div class="card"><b>添加歌曲</b>
  <div class="row"><input id="title" class="soft" placeholder="歌曲名"><input id="artist" class="soft" placeholder="歌手（可选）"></div>
  <textarea id="lyrics" placeholder="粘贴歌词。支持普通歌词，也支持 [00:12.34] 开头的 LRC 时间轴歌词。"></textarea>
  <div class="chips"><b>想练：</b><label class="chip"><input id="ko" type="checkbox" checked>韩语</label><label class="chip"><input id="ja" type="checkbox" checked>日语</label><label class="chip"><input id="zh" type="checkbox" checked>中文</label><label class="chip"><input id="en" type="checkbox" checked>英语</label></div>
  <div class="muted">混合歌词按整句语境处理：韩语句里的 no / baby / yeah 不会因为关闭英语而消失。</div>
  <div class="row"><label class="soft file">♪ 选择本机原曲<input id="audiofile" type="file" accept="audio/*"></label><span id="audioName" class="muted">可选 · 音频不会保存或上传</span></div>
  <div class="row"><button id="saveSong" class="primary">保存并开始学习</button><button id="cancelEdit" class="soft">返回</button></div>
 </div>
</section>

<section id="song" class="hide">
 <div class="songrow"><div><button id="back" class="soft">‹ 我的歌曲</button><h2 id="songTitle" style="margin:12px 2px 0"></h2><div id="songMeta" class="muted"></div></div><div id="pct"></div></div>
 <div class="progress"><div id="bar" class="bar" style="width:0"></div></div>
 <nav class="tabs"><button class="mode active" data-mode="learn">📖 学习</button><button class="mode" data-mode="sing">🎤 跟唱</button><button class="mode" data-mode="challenge">🎯 挑战</button><button class="mode" data-mode="show">🎭 演出准备</button></nav>
 <div id="modeContent"></div>
</section>

<section id="settingsPanel" class="hide">
 <div class="card"><b>外观与学习设置</b>
 <div class="row"><span>界面/翻译语言</span><select id="uiLang" class="soft"><option>简体中文</option><option>English</option><option>日本語</option><option>한국어</option></select></div>
 <div class="row"><span>字体</span><select id="font" class="soft"><option value="system">清爽系统体</option><option value="round">圆润可爱体</option><option value="serif">柔和衬线体</option></select></div>
 <div class="palette"><span>主题</span><button class="dot" data-c="#9b8cf4"></button><button class="dot" data-c="#ee91b4"></button><button class="dot" data-c="#74b9a7"></button><button class="dot" data-c="#79a9e8"></button><button class="dot" data-c="#e8aa68"></button><button class="dot" data-c="#303038"></button><input id="color" type="color"></div>
 <div class="muted" style="margin-top:10px">V4.1 先把界面结构和本地进度跑通。自动翻译、自动拼音/罗马字、在线曲库和账号同步会在后续接入。</div>
 <div class="row"><button id="closeSettings" class="primary">完成</button></div></div>
</section>
<audio id="audio"></audio>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], synth=speechSynthesis;
let songs=JSON.parse(localStorage.getItem("singitSongs")||"[]"), current=null, audioURL="", stopTimer=null;
const R={ko:/[\uAC00-\uD7A3]/g,kana:/[\u3040-\u30ff]/g,han:/[\u3400-\u9fff]/g,en:/[A-Za-z]/g};
const cnt=(r,s)=>(s.match(r)||[]).length;
function lang(s){let ko=cnt(R.ko,s),ka=cnt(R.kana,s),han=cnt(R.han,s),en=cnt(R.en,s);if(ko&&ko>=en*.5)return"ko";if(ka)return"ja";if(han&&!ka)return"zh";if(en)return"en";return null}
function tLang(s){if(cnt(R.ko,s))return"ko";if(cnt(R.kana,s))return"ja";if(cnt(R.han,s))return"zh";if(cnt(R.en,s))return"en";return null}
function parse(raw){return raw.split(/\n/).map(x=>{let m=x.match(/^\s*\[(\d{1,3}):(\d{2}(?:\.\d{1,3})?)\]\s*(.*)$/);return m?{time:+m[1]*60+ +m[2],text:m[3].trim()}:{time:null,text:x.trim()}}).filter(x=>x.text)}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem("singitSongs",JSON.stringify(songs))}
function show(id){["home","editor","song","settingsPanel"].forEach(x=>$("#"+x).classList.toggle("hide",x!==id))}
function renderLibrary(){
 if(!songs.length){$("#library").innerHTML='<div class="empty">还没有歌曲。添加第一首喜欢的歌吧 ♡</div>';return}
 $("#library").innerHTML='<h3>我的歌曲</h3>'+songs.map(s=>{let done=Object.values(s.progress||{}).filter(x=>x.learned).length,total=s.lines.length,p=Math.round(done/Math.max(1,total)*100);return `<div class="card openSong" data-id="${s.id}"><div class="songrow"><div><b>${esc(s.title)}</b><div class="muted">${esc(s.artist||"")} · ${done}/${total} 句已学会</div></div><b>${p}%</b></div><div class="progress"><div class="bar" style="width:${p}%"></div></div></div>`}).join("")
}
function speak(text,l){let u=new SpeechSynthesisUtterance(text);u.lang=l==="ko"?"ko-KR":l==="ja"?"ja-JP":l==="zh"?"zh-CN":"en-US";u.rate=.82;synth.cancel();synth.speak(u)}
function updateProgress(){let s=current,done=Object.values(s.progress||{}).filter(x=>x.learned).length,p=Math.round(done/Math.max(1,s.lines.length)*100);$("#pct").textContent=p+"%";$("#bar").style.width=p+"%";save()}
function openSong(id){current=songs.find(x=>x.id==id);show("song");$("#songTitle").textContent=current.title;$("#songMeta").textContent=(current.artist?current.artist+" · ":"")+current.lines.length+" 句";updateProgress();setMode("learn")}
function setMode(mode){
 $$(".mode").forEach(x=>x.classList.toggle("active",x.dataset.mode===mode));
 if(mode==="learn")renderLearn();
 else if(mode==="sing")renderSing();
 else if(mode==="challenge")renderChallenge();
 else renderShow();
}
function renderLearn(){
 $("#modeContent").innerHTML=current.lines.map((x,i)=>{let toks=x.text.split(/\s+/),p=current.progress[i]||{},next=current.lines[i+1]?.time;
 return `<section class="card" id="line${i}"><div class="lyricHead"><div class="lyricBody"><div class="roman">${x.roman||""}</div><div class="tokens">${toks.map(t=>`<button class="word say" data-text="${esc(t)}" data-lang="${tLang(t)||x.lang}">${esc(t)}</button>`).join("")}</div><div class="translation">${x.translation||"翻译将在正式智能版本中自动生成"}</div></div><div class="actions"><button class="round say" data-text="${esc(x.text)}" data-lang="${x.lang}">🔊</button>${x.time!=null?`<button class="round original" data-start="${x.time}" data-end="${next??""}" ${audioURL?"":"disabled"}>♪</button>`:""}</div></div><div class="answers">${toks.map(t=>`<input class="ans" data-answer="${esc(t)}" placeholder="…">`).join("")}</div><div class="state"><button class="star ${p.star?"starred":""}" data-i="${i}">${p.star?"★ 难句":"☆ 难句"}</button><button class="learn ${p.learned?"learned":""}" data-i="${i}">${p.learned?"✓ 已学会":"○ 标记学会"}</button></div></section>`}).join("")
}
function renderSing(){
 let idx=current.last||0,x=current.lines[idx]||current.lines[0],next=current.lines[idx+1];
 $("#modeContent").innerHTML=`<div class="card big"><div class="muted">跟唱模式 · ${idx+1}/${current.lines.length}</div><div class="romaji">${x.roman||""}</div><div class="mainline">${esc(x.text)}</div><div class="translation">${x.translation||""}</div><div class="row" style="justify-content:center"><button class="round say" data-text="${esc(x.text)}" data-lang="${x.lang}">🔊</button>${x.time!=null?`<button class="round original" data-start="${x.time}" data-end="${next?.time??""}" ${audioURL?"":"disabled"}>♪</button>`:""}<button class="soft navline" data-d="-1">‹ 上一句</button><button class="primary navline" data-d="1">下一句 ›</button></div>${next?`<div class="nextline">下一句 · ${esc(next.text)}</div>`:""}</div>`
}
function renderChallenge(){
 let candidates=current.lines.map((x,i)=>({x,i})).filter(o=>(current.progress[o.i]||{}).learned);let o=candidates[0]||{x:current.lines[0],i:0};
 $("#modeContent").innerHTML=`<div class="card big"><div class="muted">挑战模式 · 优先挑战已学会的歌词</div><div class="mainline">♪ 先听，再试着写出这一句</div><button class="round say" data-text="${esc(o.x.text)}" data-lang="${o.x.lang}">🔊</button><div style="margin-top:16px"><input id="challengeInput" class="soft" style="width:90%" placeholder="输入你记得的歌词……"></div><div class="row" style="justify-content:center"><button id="reveal" class="primary" data-text="${esc(o.x.text)}">给我看答案</button></div><div id="answerReveal" class="mainline hide">${esc(o.x.text)}</div></div>`
}
function renderShow(){
 $("#modeContent").innerHTML=`<div class="card hero"><h2>🎭 演出准备</h2><div class="muted">给这首歌设一个目标日期。正式版会根据剩余歌词、难句和日期自动安排“学习 → 难句 → 跟唱 → 完整模拟”。</div><div class="row"><input id="showDate" type="date" class="soft" value="${current.showDate||""}"><button id="saveDate" class="primary">保存日期</button></div></div>`
}
$("#newSong").onclick=()=>show("editor");$("#cancelEdit").onclick=()=>show("home");$("#back").onclick=()=>{renderLibrary();show("home")};
$("#saveSong").onclick=()=>{let raw=$("#lyrics").value.trim();if(!raw)return alert("先粘贴歌词哦");let enabled={ko:$("#ko").checked,ja:$("#ja").checked,zh:$("#zh").checked,en:$("#en").checked};let lines=parse(raw).map(x=>({...x,lang:lang(x.text)})).filter(x=>x.lang&&enabled[x.lang]);let s={id:Date.now(),title:$("#title").value.trim()||"未命名歌曲",artist:$("#artist").value.trim(),lines,progress:{},last:0,created:Date.now()};songs.unshift(s);save();current=s;openSong(s.id)};
$("#audiofile").onchange=e=>{let f=e.target.files[0];if(f){audioURL=URL.createObjectURL(f);$("#audio").src=audioURL;$("#audioName").textContent=f.name+" · 仅本机本次使用"}};
document.addEventListener("click",e=>{
 let os=e.target.closest(".openSong");if(os)return openSong(+os.dataset.id);
 let m=e.target.closest(".mode");if(m)return setMode(m.dataset.mode);
 let sy=e.target.closest(".say");if(sy)return speak(sy.dataset.text,sy.dataset.lang);
 let or=e.target.closest(".original");if(or){let a=$("#audio"),st=+or.dataset.start,en=or.dataset.end===""?null:+or.dataset.end;clearTimeout(stopTimer);a.currentTime=st;a.play();if(en!=null)stopTimer=setTimeout(()=>a.pause(),Math.max(300,(en-st)*1000));return}
 let star=e.target.closest(".star");if(star){let i=star.dataset.i,p=current.progress[i]||(current.progress[i]={});p.star=!p.star;save();renderLearn();return}
 let le=e.target.closest(".learn");if(le){let i=le.dataset.i,p=current.progress[i]||(current.progress[i]={});p.learned=!p.learned;current.last=+i;updateProgress();renderLearn();return}
 let nav=e.target.closest(".navline");if(nav){current.last=Math.max(0,Math.min(current.lines.length-1,(current.last||0)+ +nav.dataset.d));save();renderSing();return}
 let dot=e.target.closest(".dot");if(dot)return setTheme(dot.dataset.c);
 if(e.target.id==="reveal")$("#answerReveal").classList.remove("hide");
 if(e.target.id==="saveDate"){current.showDate=$("#showDate").value;save();e.target.textContent="✓ 已保存"}
});
document.addEventListener("input",e=>{if(e.target.matches(".ans")){e.target.classList.toggle("ok",e.target.value.trim()===e.target.dataset.answer)}if(e.target.id==="color")setTheme(e.target.value)});
$("#settings").onclick=()=>show("settingsPanel");$("#closeSettings").onclick=()=>{renderLibrary();show("home")};
function setTheme(c){document.documentElement.style.setProperty("--a",c);$("#color").value=c;localStorage.setItem("singitColor",c)}
function setFont(v){let f=v==="round"?'"Arial Rounded MT Bold","PingFang SC","Apple SD Gothic Neo",sans-serif':v==="serif"?'"Songti SC","Noto Serif CJK SC",serif':'-apple-system,BlinkMacSystemFont,"PingFang SC","Apple SD Gothic Neo","Hiragino Sans",sans-serif';document.documentElement.style.setProperty("--font",f);localStorage.setItem("singitFont",v)}
$("#font").onchange=e=>setFont(e.target.value);
setTheme(localStorage.getItem("singitColor")||"#9b8cf4");$("#font").value=localStorage.getItem("singitFont")||"system";setFont($("#font").value);renderLibrary();
</script></main></body></html>
