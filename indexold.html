<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sing It V4.5</title>
<style>
:root{--a:#181a20;--at:#fff;--bg:#f6f6f3;--tx:#181a20;--card:#fff;--soft:#ececea;--ln:#dddeda;--mu:#7b7f87;--bad:#d94b54}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}button,input{font:inherit;color:inherit}.app{max-width:620px;margin:auto;min-height:100dvh;padding-bottom:72px}.hide{display:none!important}.top{height:58px;padding:10px 18px;display:flex;justify-content:space-between;align-items:center}.icon{border:0;background:none;padding:9px;font-weight:700}.hero{min-height:calc(100dvh - 130px);display:flex;align-items:center;padding:30px}.heroIn{width:100%;text-align:center}.mark{width:58px;height:58px;border-radius:18px;background:var(--a);margin:0 auto 25px}h1{font-size:42px;margin:0 0 10px}.tag{margin-bottom:42px}.search,.card{background:var(--card);border:1px solid var(--ln);border-radius:18px}.search{padding:14px 16px;text-align:left;color:var(--mu)}.primary{width:100%;border:0;border-radius:17px;padding:15px;background:var(--a);color:var(--at);font-weight:750;margin-top:12px}.nav{position:fixed;z-index:15;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);height:72px;background:var(--bg);border-top:1px solid var(--ln);display:flex}.nav button{flex:1;border:0;background:none;color:var(--mu)}.nav .on{color:var(--tx);font-weight:800}.page{padding:0 18px}.brand{display:flex;align-items:center;gap:11px;padding:14px 0 20px}.brand .mark{width:31px;height:31px;border-radius:9px;margin:0}.section{margin:25px 0}.section h2{font-size:19px}.song{display:flex;align-items:center;gap:12px;padding:13px;margin:9px 0}.cover{width:48px;height:48px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-weight:800}.meta{flex:1}.small{font-size:12px;color:var(--mu)}.pill{border:0;border-radius:99px;padding:9px 14px;background:var(--a);color:var(--at)}
.lesson{padding-bottom:65px}.lh{position:sticky;top:0;z-index:7;background:var(--bg);border-bottom:1px solid var(--ln);padding:7px 16px 4px}.title{text-align:center;position:relative}.back{position:absolute;left:0;top:-3px;border:0;background:none;font-size:24px;padding:5px}.title b{display:block}.tabs{display:flex;margin-top:8px}.tabs button{flex:1;border:0;background:none;padding:10px;color:var(--mu)}.tabs .on{color:var(--tx);font-weight:800;border-bottom:2px solid var(--tx)}.tools{display:flex;gap:6px;overflow:auto;padding:9px 0 3px}.tools button{white-space:nowrap;border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:7px 10px;font-size:12px}.tools .on{background:var(--a);color:var(--at)}.tools .label{border-color:transparent;background:transparent;font-weight:800;padding-left:0}.tools .label:active{background:transparent}.tools .disabled{opacity:.35}.perline{display:flex;gap:5px;margin-bottom:8px;overflow:auto}.perline button{border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:5px 8px;font-size:10px;white-space:nowrap}.perline .on{background:var(--a);color:var(--at)}
.line{padding:20px 0;border-bottom:1px solid var(--ln)}.chunks,.inputs,.challenge{display:grid;gap:8px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}.chunks{grid-template-columns:repeat(var(--n),minmax(0,1fr)) 35px}.chunk{min-width:0;border:0;border-radius:9px;background:var(--soft);padding:10px 5px;font-size:13px;font-weight:700}.chunk.covered{color:transparent}.play{width:34px;height:34px;border:0;border-radius:50%;background:var(--a);color:var(--at)}.inputs{padding-right:43px;margin-top:8px}.inputs input,.challenge input{width:100%;min-width:0;border:1px solid var(--ln);background:var(--card);border-radius:9px;padding:10px 7px;outline:0}.bad{color:var(--bad)!important;border-color:var(--bad)!important}.extra{font-size:12px;color:var(--mu);padding-right:43px;margin-top:7px}.switch{position:fixed;z-index:8;bottom:72px;left:50%;transform:translateX(-50%);width:min(620px,100%);display:flex;justify-content:space-between;padding:8px 18px;background:var(--bg);border-top:1px solid var(--ln)}.switch button{border:0;border-radius:13px;background:var(--soft);padding:10px 15px}
.sheetBack,.modal{position:fixed;inset:0;z-index:30;background:#0006;display:flex;justify-content:center}.sheetBack{align-items:flex-end}.sheet{width:min(620px,100%);background:var(--bg);border-radius:24px 24px 0 0;padding:22px 20px 28px}.setting{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--ln)}.switcher{width:46px;height:27px;border-radius:99px;border:0;background:#c8c9c7;padding:3px}.switcher i{display:block;width:21px;height:21px;border-radius:50%;background:white;transition:.2s}.switcher.on{background:var(--a)}.switcher.on i{transform:translateX(19px)}.colors{display:flex;gap:12px}input[type=color]{width:42px;height:34px;border:0;background:none}.modal{align-items:center;padding:25px}.mc{width:min(350px,100%);background:var(--bg);border-radius:22px;padding:21px}.actions{display:flex;gap:9px;margin-top:18px}.actions button{flex:1;border:0;border-radius:13px;padding:12px;background:var(--soft)}.actions .yes{background:var(--a);color:var(--at)}.modeChoice{display:flex;gap:8px;justify-content:center;margin:18px auto 8px}.modeChoice button{border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:10px 15px}.modeChoice .on{background:var(--a);color:var(--at)}.record{margin:24px auto;border:1px solid var(--ln);border-radius:18px;padding:18px;max-width:420px}.recBtns{display:flex;gap:8px;justify-content:center}.recBtns button{border:0;border-radius:99px;padding:11px 15px;background:var(--soft)}.toast{position:fixed;z-index:50;top:72px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:99px;font-size:12px;white-space:nowrap}
</style></head><body><div class="app">
<section id="landing"><div class="top"><span></span><button class="icon" onclick="appearance.classList.remove('hide')">Aa</button></div><div class="hero"><div class="heroIn"><div class="mark"></div><h1>Sing It</h1><div class="tag">喜欢这首歌？把它唱会。</div><div id="landingSearch" class="search" onclick="firstSong()">⌕　搜索歌曲或歌手</div><button id="landingBtn" class="primary" onclick="firstSong()">＋ 添加一首歌</button><div id="savedGuest" class="hide section"><div class="song card"><div class="cover">H</div><div class="meta"><b>Hurt</b><div class="small">刚刚练过 · 记录已保留</div></div></div></div></div></div></section>
<section id="home" class="page hide"><div class="brand"><div class="mark"></div><b>Sing It</b></div><div class="search">⌕　搜索歌曲或歌手　　＋ 添加</div><div class="section"><h2>正在学习</h2><div class="song card"><div class="cover">H</div><div class="meta"><b>Hurt</b><div class="small">NewJeans · 学习记录已保留</div></div><button class="pill" onclick="openLesson()">继续</button></div></div><div class="section"><h2>接下来</h2><div class="song card"><div class="cover">D</div><div class="meta"><b>Ditto</b></div></div><div class="song card"><div class="cover">S</div><div class="meta"><b>Super Shy</b></div></div></div></section>
<section id="profile" class="page hide"><h1>我的</h1><div class="song card"><div class="cover">S</div><div class="meta"><b>Sing It 用户</b><div class="small">已登录体验状态</div></div></div><div class="section card" style="padding:5px 16px"><p>我的歌曲　›</p><p>学习记录　›</p><p>学习队列　›</p><p onclick="appearance.classList.remove('hide')">外观与语言　›</p><p>帮助与反馈　›</p></div></section>
<section id="lesson" class="lesson hide"><div class="lh"><div class="title"><button class="back" onclick="backFromLesson()">‹</button><b>Hurt</b><span class="small">NewJeans</span></div><div class="tabs"><button class="on" onclick="mode('learn',this)">学习</button><button onclick="mode('sing',this)">跟唱</button><button onclick="mode('challenge',this)">挑战</button></div><div id="tools" class="tools"><button class="label">统一设置</button><button id="globalBtn" class="on" onclick="toggleUnified(this)">统一</button><button id="typingBtn" class="on" onclick="flag('typing',this)">打字</button><button onclick="flag('translation',this)">翻译</button><button onclick="flag('covered',this)">隐藏歌词</button><button onclick="flag('assist',this)">发音辅助</button><button id="correctBtn" onclick="flag('correct',this)">纠错</button></div></div><div id="learn" class="page"></div><div id="sing" class="page hide"></div><div id="challenge" class="page hide"></div><div class="switch"><button onclick="songConfirm('上一首','Super Shy')">‹ 上一首</button><button onclick="songConfirm('下一首','Ditto')">下一首 ›</button></div></section>
<nav class="nav"><button onclick="navTo('home',this)">⌂<br>首页</button><button class="on" onclick="navTo('study',this)">▣<br>学习</button><button onclick="navTo('profile',this)">●<br>我的</button></nav></div>

<div id="appearance" class="sheetBack hide"><div class="sheet"><h2>外观</h2><div class="setting"><span>按钮 / 框颜色</span><input type="color" value="#181a20" oninput="setv('--a',this.value)"></div><div class="setting"><span>页面底色</span><input type="color" value="#f6f6f3" oninput="setv('--bg',this.value)"></div><div class="setting"><span>文字颜色</span><input type="color" value="#181a20" oninput="setv('--tx',this.value)"></div><button class="primary" onclick="appearance.classList.add('hide');save()">完成</button></div></div>
<div id="modal" class="modal hide"><div class="mc"><div id="mdir" class="small"></div><h2 id="msong"></h2><div class="small">NewJeans</div><div class="actions"><button onclick="modal.classList.add('hide')">取消</button><button class="yes" onclick="switchSong()">确认</button></div></div></div>
<script>
const L=[["I don't wanna","fall in love","again"],["But I know","that I can't","help it"],["I just wanna","be with you"],["And I'll try","not to let it show"]],T=["我不想再次坠入爱河","但我知道自己无法控制","我只想和你在一起","而我会试着不让它显露"];let F={typing:true,translation:false,covered:false,assist:false,correct:false},unified=true,PF=L.map(()=>({...F})),experienced=localStorage.getItem('singit_experienced')==='1',logged=localStorage.getItem('singit_logged')==='1',rec=null,stream=null,singDone=L.map(()=>false),lineAudios=L.map(()=>null),singIndex=0,challengeMode='write',fullChallengeAudio=null;
function q(x){return document.getElementById(x)}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}function hide(){['landing','home','profile','lesson'].forEach(x=>q(x).classList.add('hide'))}
function firstSong(){if(experienced){openLesson();return}experienced=true;localStorage.setItem('singit_experienced','1');updateLanding();openLesson()}function updateLanding(){if(experienced){q('landingBtn').textContent='继续练习';q('landingBtn').onclick=openLesson;q('landingSearch').textContent=logged?'⌕　搜索歌曲或歌手':'这一首体验已记录 · 登录后可添加更多歌曲';q('savedGuest').classList.remove('hide')}}
function openLesson(){hide();q('lesson').classList.remove('hide');render();renderSing();renderChallenge()}function backFromLesson(){hide();if(logged)q('home').classList.remove('hide');else{q('landing').classList.remove('hide');updateLanding()}}
function navTo(w,b){if(!logged&&w!=='study'){if(w==='home'){backFromLesson();return}showLogin();return}hide();if(w==='home')q('home').classList.remove('hide');if(w==='profile')q('profile').classList.remove('hide');if(w==='study')openLesson();document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function norm(s){return s.toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\u00c0-\u024f\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]+/g,'').trim()}function safe(s){return s.replaceAll('&','&amp;').replaceAll('"','&quot;')}function jq(s){return s.replaceAll("\\","\\\\").replaceAll("'","\\'")}
function perControls(i,f){if(unified)return '';return `<div class="perline"><button class="${f.typing?'on':''}" onclick="lineFlag(${i},'typing')">打字</button><button class="${f.translation?'on':''}" onclick="lineFlag(${i},'translation')">翻译</button><button class="${f.covered?'on':''}" onclick="lineFlag(${i},'covered')">隐藏</button><button class="${f.assist?'on':''}" onclick="lineFlag(${i},'assist')">发音</button><button class="${f.correct?'on':''} ${!f.typing?'disabled':''}" onclick="lineFlag(${i},'correct')">纠错</button></div>`}
function render(){q('learn').innerHTML='';L.forEach((a,i)=>{let f=unified?F:PF[i],d=document.createElement('div');d.className='line';d.style.setProperty('--n',a.length);d.innerHTML=`${perControls(i,f)}<div class="chunks">${a.map(x=>`<button class="chunk ${f.covered?'covered':''}" onclick="speak('${jq(x)}')">${safe(x)}</button>`).join('')}<button class="play" onclick="speak('${jq(a.join(" "))}')">▶</button></div>${f.assist?`<div class="extra">发音辅助 · ${a.join('　·　')}</div>`:''}${f.typing?`<div class="inputs">${a.map(x=>`<input data-a="${safe(x)}" data-line="${i}" onkeydown="learnKey(event,this)">`).join('')}</div>`:''}${f.translation?`<div class="extra">${T[i]}</div>`:''}`;q('learn').appendChild(d)})}
function learnKey(e,el){if(e.key!=='Enter')return;let i=+el.dataset.line,f=unified?F:PF[i],ok=norm(el.value)===norm(el.dataset.a);if(f.correct)el.classList.toggle('bad',!ok);else el.classList.remove('bad');if(ok)speak(el.value);let all=[...document.querySelectorAll('#learn input')],p=all.indexOf(el);if((ok||!f.correct)&&all[p+1])all[p+1].focus()}
function flag(k,b){if(k==='correct'&&!F.typing)return;F[k]=!F[k];b.classList.toggle('on',F[k]);if(k==='typing'){q('correctBtn').classList.toggle('disabled',!F.typing)}render()}function lineFlag(i,k){if(k==='correct'&&!PF[i].typing)return;PF[i][k]=!PF[i][k];render()}function toggleUnified(b){unified=!unified;b.classList.toggle('on',unified);['typingBtn','correctBtn'].forEach(id=>q(id).classList.toggle('hide',!unified));[...q('tools').querySelectorAll('button')].slice(3,6).forEach(x=>x.classList.toggle('hide',!unified));render()}
function mode(m,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['learn','sing','challenge'].forEach(x=>q(x).classList.add('hide'));q(m).classList.remove('hide');q('tools').classList.toggle('hide',m!=='learn');if(m==='sing')renderSing();if(m==='challenge')renderChallenge()}
function renderSing(){let done=singDone.every(Boolean),a=L[singIndex];q('sing').innerHTML=`<div style="text-align:center;padding-top:38px"><div class="small">跟唱 · ${singIndex+1} / ${L.length}</div><h2>${a.join(' ')}</h2><button class="primary" style="width:120px;border-radius:99px" onclick="speak('${jq(a.join(" "))}')">▶ 听原句</button><div class="record"><b>${singDone[singIndex]?'这一句已录好':'录下自己这一句'}</b><p class="small">不评分，不判断唱得好不好。</p><div class="recBtns"><button onclick="recordLine(${singIndex})">● ${singDone[singIndex]?'重录':'录音'}</button><button onclick="playLine(${singIndex})">▶ 回听</button></div></div><div class="recBtns"><button onclick="singMove(-1)">‹ 上一句</button><button onclick="singMove(1)">下一句 ›</button></div>${done?`<button class="primary" style="max-width:360px;margin-top:28px" onclick="playAllLines()">▶ 听听我唱的整首歌</button><p class="small">全部句子录完后才会出现</p>`:''}</div>`}
function singMove(d){singIndex=Math.max(0,Math.min(L.length-1,singIndex+d));renderSing()}
async function capture(seconds=6){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];return await new Promise((resolve,reject)=>{rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());resolve(URL.createObjectURL(new Blob(chunks,{type:rec.mimeType})))};rec.start();toast('正在录音');setTimeout(()=>{if(rec.state==='recording')rec.stop()},seconds*1000)})}catch(e){toast('浏览器未允许麦克风权限');return null}}
async function recordLine(i){let u=await capture();if(u){lineAudios[i]=u;singDone[i]=true;toast('这一句已保存');renderSing()}}function playLine(i){if(lineAudios[i])new Audio(lineAudios[i]).play();else toast('这一句还没有录音')}
async function playAllLines(){if(!singDone.every(Boolean))return;for(let u of lineAudios){await new Promise(r=>{let a=new Audio(u);a.onended=r;a.play()})}}
function renderChallenge(){if(challengeMode==='write')renderWriteChallenge();else renderSingChallenge()}
function choice(){return `<div class="modeChoice"><button class="${challengeMode==='write'?'on':''}" onclick="challengeMode='write';renderChallenge()">默写歌词</button><button class="${challengeMode==='sing'?'on':''}" onclick="challengeMode='sing';renderChallenge()">默唱整首</button></div>`}
function renderWriteChallenge(){q('challenge').innerHTML=choice()+'<p class="small" style="text-align:center">不评分。按回车检查文字；有差异只标红，你仍然可以继续。</p>';L.forEach(a=>{let d=document.createElement('div');d.className='line';d.style.setProperty('--n',a.length);d.innerHTML=`<div class="challenge">${a.map(x=>`<input data-a="${safe(x)}" onkeydown="challengeKey(event,this)">`).join('')}</div>`;q('challenge').appendChild(d)})}
function challengeKey(e,el){if(e.key!=='Enter')return;el.classList.toggle('bad',norm(el.value)!==norm(el.dataset.a));let a=[...document.querySelectorAll('#challenge input')],i=a.indexOf(el);if(a[i+1])a[i+1].focus()}
function renderSingChallenge(){q('challenge').innerHTML=choice()+`<div style="text-align:center;padding-top:35px"><div class="small">不看歌词 · 从头唱到尾</div><h2>Hurt</h2><p class="small">不评分、不纠错。这里只留下你自己的声音。</p><button class="primary" style="max-width:280px" onclick="recordFullChallenge()">● ${fullChallengeAudio?'重新录一遍':'开始录音'}</button>${fullChallengeAudio?`<button class="primary" style="max-width:280px;background:var(--soft);color:var(--tx)" onclick="new Audio(fullChallengeAudio).play()">▶ 听听我刚刚唱的</button>`:''}</div>`}
async function recordFullChallenge(){let u=await capture(15);if(u){fullChallengeAudio=u;toast('整首挑战录音已保存');renderSingChallenge()}}
function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}
function songConfirm(d,s){q('mdir').textContent=d;q('msong').textContent=s;q('modal').classList.remove('hide')}function switchSong(){q('modal').classList.add('hide');if(!logged){showLogin()}else toast('已切换歌曲（体验版）')}
function showLogin(){q('mdir').textContent='继续使用 Sing It';q('msong').textContent='登录后可添加和切换更多歌曲';q('modal').classList.remove('hide');q('modal').querySelector('.yes').textContent='体验登录';q('modal').querySelector('.yes').onclick=()=>{logged=true;localStorage.setItem('singit_logged','1');q('modal').classList.add('hide');q('modal').querySelector('.yes').textContent='确认';q('modal').querySelector('.yes').onclick=switchSong;toast('已进入登录后的体验状态');updateLanding()}}
function setv(k,v){document.documentElement.style.setProperty(k,v)}function save(){localStorage.setItem('singit_theme',JSON.stringify({a:getComputedStyle(document.documentElement).getPropertyValue('--a').trim(),bg:getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(),tx:getComputedStyle(document.documentElement).getPropertyValue('--tx').trim()}))}function load(){try{let x=JSON.parse(localStorage.getItem('singit_theme'));if(x){setv('--a',x.a);setv('--bg',x.bg);setv('--tx',x.tx)}}catch(e){}}
load();updateLanding();render();renderSing();renderChallenge();
</script></body></html>
